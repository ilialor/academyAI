[tool.poetry]
name = "pipeline_worker"
version = "0.1.0"
description = "Content processing worker for AcademyOpenAI"
authors = ["AcademyOpenAI Team"]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.5.2"
pydantic-settings = "^2.1.0"
aio-pika = "^9.3.0"
python-multipart = "^0.0.6"
ffmpeg-python = "^0.2.0"
opencv-python = "^4.8.1"
numpy = "^1.26.2"
pytesseract = "^0.3.10"
whisper = "^1.1.10"
requests = "^2.31.0"
asyncio = "^3.4.3"
loguru = "^0.7.2"
google-generativeai = "*"
celery = "^5.3.6"
redis = "^5.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"